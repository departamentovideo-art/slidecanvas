<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SlideCanvas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass: rgba(12,12,16,0.82);
  --glass-border: rgba(255,255,255,0.10);
  --accent: #e8c87a;
  --danger: #e87a7a;
  --text: #f0efe8;
  --text-dim: rgba(240,239,232,0.45);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── Slide fills screen ──────────────────────────────── */
#slide-canvas, #draw-canvas {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: block;
}
#draw-canvas { cursor: crosshair; z-index: 1; touch-action: none; }

/* ── UI layer ────────────────────────────────────────── */
#ui {
  position: fixed; inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
}
#ui.visible { opacity: 1; }
#ui > * { pointer-events: auto; }

/* ── Top bar ─────────────────────────────────────────── */
#top-bar {
  position: absolute;
  top: 20px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  padding: 6px 10px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: 40px;
  white-space: nowrap;
}

/* ── Bottom toolbar ──────────────────────────────────── */
#bottom-bar {
  position: absolute;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 7px 12px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: 40px;
}

/* ── Thumbnail drawer ────────────────────────────────── */
#thumb-drawer {
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 158px;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column;
  padding: 76px 8px 20px;
  gap: 8px;
  overflow-y: auto; overflow-x: hidden;
  transform: translateX(-100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
#thumb-drawer.open { transform: translateX(0); }
#thumb-drawer::-webkit-scrollbar { width: 3px; }
#thumb-drawer::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

.thumb-item {
  position: relative; border-radius: 6px; overflow: hidden;
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
  transition: border-color .15s, transform .15s;
}
.thumb-item:hover { transform: scale(1.04); }
.thumb-item.active { border-color: var(--accent); }
.thumb-item canvas { display: block; width: 100%; border-radius: 4px; }
.thumb-num {
  position: absolute; bottom: 3px; right: 5px;
  font-size: 10px; color: rgba(255,255,255,.4);
  font-variant-numeric: tabular-nums;
}
.thumb-del {
  position: absolute; top: 3px; right: 3px;
  width: 17px; height: 17px;
  background: rgba(0,0,0,.7); border: none; border-radius: 50%;
  color: #fff; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 0; transition: opacity .15s;
}
.thumb-item:hover .thumb-del { opacity: 1; }

#drawer-add {
  display: flex; align-items: center; justify-content: center;
  height: 32px; border-radius: 8px;
  border: 1.5px dashed rgba(255,255,255,.18);
  background: transparent; color: var(--text-dim);
  font-size: 20px; cursor: pointer;
  transition: border-color .15s, color .15s; flex-shrink: 0;
}
#drawer-add:hover { border-color: var(--accent); color: var(--accent); }

/* ── Buttons ─────────────────────────────────────────── */
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border: none; border-radius: 10px;
  background: transparent; color: var(--text-dim);
  font-size: 16px; cursor: pointer;
  transition: background .15s, color .15s, transform .1s;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.btn:hover { background: rgba(255,255,255,.09); color: var(--text); }
.btn.active { background: var(--accent); color: #1a1400; }
.btn:active { transform: scale(.9); }
.btn.red { color: var(--danger); }
.btn.red:hover { background: rgba(232,122,122,.13); }

.sep { width: 1px; height: 24px; background: var(--glass-border); margin: 0 2px; flex-shrink: 0; }
.counter { font-size: 11px; color: var(--text-dim); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

/* ── Palette ─────────────────────────────────────────── */
#palette { display: flex; gap: 4px; align-items: center; padding: 0 2px; }
.cdot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
  transition: transform .15s, border-color .15s;
}
.cdot:hover { transform: scale(1.25); }
.cdot.active { border-color: #fff; transform: scale(1.2); }

/* ── Size slider ─────────────────────────────────────── */
#size-wrap { display: flex; align-items: center; gap: 5px; padding: 0 4px; }
#size-wrap input[type=range] {
  -webkit-appearance: none; width: 62px; height: 3px;
  background: rgba(255,255,255,.2); border-radius: 2px; outline: none; cursor: pointer;
}
#size-wrap input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
}
#sz-preview { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
#sz-dot { border-radius: 50%; background: var(--text); transition: width .1s, height .1s; }

/* ── Background swatches ─────────────────────────────── */
#bg-panel {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(6px);
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 12px 14px; display: flex; gap: 7px; flex-wrap: wrap; max-width: 290px;
  z-index: 20; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#bg-panel.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.bg-sw {
  width: 32px; height: 32px; border-radius: 8px;
  border: 2px solid transparent; cursor: pointer;
  transition: transform .15s, border-color .15s; flex-shrink: 0;
}
.bg-sw:hover { transform: scale(1.15); }
.bg-sw.active { border-color: #fff; }

/* ── Hint ────────────────────────────────────────────── */
#hint {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,255,255,.22); pointer-events: none;
  z-index: 5; transition: opacity .5s; letter-spacing: .04em;
}
#hint.gone { opacity: 0; }

/* ── Toast ───────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(12,12,16,.9); border: 1px solid var(--glass-border);
  color: var(--text); padding: 7px 18px; border-radius: 20px;
  font-size: 13px; z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .3s; backdrop-filter: blur(12px); white-space: nowrap;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="slide-canvas"></canvas>
<canvas id="draw-canvas"></canvas>

<div id="ui">
  <!-- Top bar -->
  <div id="top-bar">
    <button class="btn" id="btn-thumbs">⊞</button>
    <div class="sep"></div>
    <button class="btn" id="btn-prev">‹</button>
    <span class="counter" id="counter">1 / 1</span>
    <button class="btn" id="btn-next">›</button>
    <div class="sep"></div>
    <button class="btn" id="btn-add" style="font-size:18px">＋</button>
    <div class="sep"></div>
    <button class="btn" id="btn-img" title="Insertar imagen">🖼</button>
    <button class="btn" id="btn-bg" title="Fondo">🎨</button>
    <input type="file" id="file-img" accept="image/*" style="display:none">
    <input type="file" id="file-bg" accept="image/*" style="display:none">
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <button class="btn active" id="tool-pen">✏️</button>
    <button class="btn" id="tool-marker">🖊</button>
    <button class="btn" id="tool-eraser">⬜</button>
    <button class="btn" id="tool-laser">🔴</button>
    <div class="sep"></div>
    <div id="palette"></div>
    <div class="sep"></div>
    <div id="size-wrap">
      <div id="sz-preview"><div id="sz-dot" style="width:5px;height:5px"></div></div>
      <input type="range" id="size-slider" min="1" max="40" value="5">
    </div>
    <div class="sep"></div>
    <button class="btn" id="btn-undo">↩</button>
    <button class="btn red" id="btn-clear">🗑</button>
  </div>

  <!-- Thumbnail drawer -->
  <div id="thumb-drawer">
    <button id="drawer-add">＋</button>
  </div>
</div>

<div id="bg-panel"></div>
<div id="hint">Toca para mostrar controles</div>
<div id="toast"></div>

<script>
/* ── Constants ─────────────────────────────────────── */
const SW = 1920, SH = 1080; // offscreen slide resolution

const COLORS = ['#ffffff','#e8c87a','#7ab8e8','#e87a9a','#7ae8b8','#e8967a','#ff4444','#000000'];
const BG_COLORS = [
  '#0f0f1a','#1a1a2e','#16213e','#0d1b2a','#1e3a2f','#2e1e1e',
  '#2a1e2e','#2e2a1a','#111118','#1a1118','#f0ede4','#d8e4f0',
  '#e8e0d0','#ffffff','#2d2d2d','#0a1628'
];

/* ── State ─────────────────────────────────────────── */
let slides = [], current = 0;
let tool = 'pen', color = '#ffffff', size = 5;
let drawing = false, laserTrail = [], laserTmr = null;
let uiVisible = false, uiTmr = null;

/* ── Canvases ──────────────────────────────────────── */
const sC = document.getElementById('slide-canvas'), dC = document.getElementById('draw-canvas');
const sX = sC.getContext('2d'), dX = dC.getContext('2d');

function resize() {
  sC.width = dC.width = window.innerWidth;
  sC.height = dC.height = window.innerHeight;
  renderCurrent();
}
window.addEventListener('resize', resize);

/* ── Slide model ───────────────────────────────────── */
const BG_DEF = ['#1a1a2e','#16213e','#1e3a2f','#2e1e1e','#2a1e2e'];

function mkSlide(bg) {
  return { bg: bg || BG_DEF[slides.length % BG_DEF.length], bgImg: null, off: null, hist: [] };
}

function offCanvas(s) {
  if (!s.off) { const c = document.createElement('canvas'); c.width = SW; c.height = SH; s.off = c; }
  return s.off;
}

function addSlide() { slides.push(mkSlide()); current = slides.length - 1; renderAll(); }

function delSlide(i) {
  if (slides.length <= 1) { toast('Mínimo una diapositiva'); return; }
  slides.splice(i, 1);
  if (current >= slides.length) current = slides.length - 1;
  renderAll();
}

/* ── Render ────────────────────────────────────────── */
function paintBg(ctx, s, w, h) {
  if (s.bgImg) {
    const sc = Math.max(w / s.bgImg.naturalWidth, h / s.bgImg.naturalHeight);
    const dw = s.bgImg.naturalWidth * sc, dh = s.bgImg.naturalHeight * sc;
    ctx.drawImage(s.bgImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = s.bg; ctx.fillRect(0, 0, w, h);
  }
}

function renderCurrent() {
  const W = sC.width, H = sC.height, s = slides[current];
  sX.clearRect(0, 0, W, H);
  paintBg(sX, s, W, H);
  dX.clearRect(0, 0, W, H);
  if (s.off) dX.drawImage(s.off, 0, 0, W, H);
  document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
}

function renderAll() { renderCurrent(); buildThumbs(); }

/* ── Thumbnails ────────────────────────────────────── */
function buildThumbs() {
  const dr = document.getElementById('thumb-drawer');
  dr.querySelectorAll('.thumb-item').forEach(e => e.remove());
  const addBtn = document.getElementById('drawer-add');
  const TW = 142, TH = Math.round(TW * SH / SW);

  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'thumb-item' + (i === current ? ' active' : '');
    const c = document.createElement('canvas');
    c.width = TW; c.height = TH;
    const ctx = c.getContext('2d');
    paintBg(ctx, s, TW, TH);
    if (s.off) ctx.drawImage(s.off, 0, 0, TW, TH);
    div.appendChild(c);
    const num = document.createElement('span'); num.className = 'thumb-num'; num.textContent = i + 1; div.appendChild(num);
    const del = document.createElement('button'); del.className = 'thumb-del'; del.textContent = '×';
    del.addEventListener('click', e => { e.stopPropagation(); delSlide(i); });
    div.appendChild(del);
    div.addEventListener('click', () => { current = i; renderAll(); });
    dr.insertBefore(div, addBtn);
  });
}

/* ── Drawing ───────────────────────────────────────── */
function saveHist() {
  const oc = offCanvas(slides[current]);
  const snap = document.createElement('canvas'); snap.width = SW; snap.height = SH;
  snap.getContext('2d').drawImage(oc, 0, 0);
  slides[current].hist.push(snap);
  if (slides[current].hist.length > 40) slides[current].hist.shift();
}

function toSlide(x, y) { return { x: x * SW / sC.width, y: y * SH / sC.height }; }
function evPos(e) { const s = e.touches ? e.touches[0] : e; return { x: s.clientX, y: s.clientY }; }

function styleCtx(ctx, scaleW) {
  const lw = size * scaleW;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hx = color.replace('#','');
  const r = parseInt(hx.slice(0,2),16), g = parseInt(hx.slice(2,4),16), b = parseInt(hx.slice(4,6),16);
  if (tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.lineWidth = lw * 2.5;
  } else if (tool === 'marker') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = `rgba(${r},${g},${b},0.45)`; ctx.lineWidth = lw * 2;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = `rgba(${r},${g},${b},1)`; ctx.lineWidth = lw;
  }
}

function startDraw(e) {
  if (hitUI(e)) return;
  e.preventDefault();
  if (tool === 'laser') laserTrail = [];
  saveHist();
  drawing = true;
  const p = evPos(e);
  if (tool !== 'laser') {
    styleCtx(dX, 1); dX.beginPath(); dX.moveTo(p.x, p.y);
    const sp = toSlide(p.x, p.y);
    const ox = offCanvas(slides[current]).getContext('2d');
    styleCtx(ox, SW / sC.width); ox.beginPath(); ox.moveTo(sp.x, sp.y);
  }
}

function doDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = evPos(e);
  if (tool === 'laser') { laserTrail.push({...p, t: Date.now()}); renderLaser(); return; }
  styleCtx(dX, 1); dX.lineTo(p.x, p.y); dX.stroke(); dX.beginPath(); dX.moveTo(p.x, p.y);
  const sp = toSlide(p.x, p.y);
  const ox = offCanvas(slides[current]).getContext('2d');
  styleCtx(ox, SW / sC.width); ox.lineTo(sp.x, sp.y); ox.stroke(); ox.beginPath(); ox.moveTo(sp.x, sp.y);
}

function endDraw() {
  if (!drawing) return;
  drawing = false;
  dX.globalCompositeOperation = 'source-over'; dX.beginPath();
  const ox = offCanvas(slides[current]).getContext('2d');
  ox.globalCompositeOperation = 'source-over'; ox.beginPath();
  if (tool === 'laser') {
    if (laserTmr) clearTimeout(laserTmr);
    laserTmr = setTimeout(() => { laserTrail = []; renderCurrent(); }, 900);
  } else { buildThumbs(); }
}

function renderLaser() {
  renderCurrent();
  const now = Date.now();
  laserTrail = laserTrail.filter(p => now - p.t < 800);
  if (laserTrail.length < 2) return;
  for (let i = 1; i < laserTrail.length; i++) {
    const a = (i / laserTrail.length) * .85;
    dX.beginPath(); dX.arc(laserTrail[i].x, laserTrail[i].y, size * .5, 0, Math.PI * 2);
    dX.fillStyle = `rgba(255,55,55,${a})`; dX.fill();
  }
  const h = laserTrail[laserTrail.length - 1];
  dX.beginPath(); dX.arc(h.x, h.y, size + 2, 0, Math.PI * 2);
  dX.fillStyle = 'rgba(255,80,80,.95)'; dX.fill();
  const g = dX.createRadialGradient(h.x, h.y, 0, h.x, h.y, size * 3);
  g.addColorStop(0, 'rgba(255,100,100,.3)'); g.addColorStop(1, 'rgba(255,0,0,0)');
  dX.beginPath(); dX.arc(h.x, h.y, size * 3, 0, Math.PI * 2); dX.fillStyle = g; dX.fill();
}

function hitUI(e) {
  const s = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(s.clientX, s.clientY);
  return el && el.closest('#ui, #bg-panel');
}

dC.addEventListener('mousedown', startDraw);
dC.addEventListener('mousemove', doDraw);
dC.addEventListener('mouseup', endDraw);
dC.addEventListener('mouseleave', endDraw);
dC.addEventListener('touchstart', startDraw, { passive: false });
dC.addEventListener('touchmove',  doDraw,     { passive: false });
dC.addEventListener('touchend',   endDraw);

/* ── UI show/hide ──────────────────────────────────── */
const ui = document.getElementById('ui'), hint = document.getElementById('hint');

function showUI(auto = true) {
  uiVisible = true;
  ui.classList.add('visible');
  hint.classList.add('gone');
  clearTimeout(uiTmr);
  if (auto) uiTmr = setTimeout(hideUI, 4500);
}
function hideUI() {
  uiVisible = false;
  ui.classList.remove('visible');
  hint.classList.remove('gone');
  document.getElementById('thumb-drawer').classList.remove('open');
  document.getElementById('bg-panel').classList.remove('open');
}

sC.addEventListener('click', e => { if (!hitUI(e)) uiVisible ? hideUI() : showUI(); });
dC.addEventListener('click', e => { if (!hitUI(e) && !drawing) uiVisible ? hideUI() : showUI(); });
ui.addEventListener('pointerenter', () => clearTimeout(uiTmr));
ui.addEventListener('pointerleave', () => { uiTmr = setTimeout(hideUI, 3500); });

/* ── Toolbar wiring ────────────────────────────────── */
function setTool(t) {
  tool = t;
  ['tool-pen','tool-marker','tool-eraser','tool-laser'].forEach(id =>
    document.getElementById(id).classList.toggle('active', id.endsWith(t)));
  dC.style.cursor = t === 'eraser' ? 'cell' : 'crosshair';
}
document.getElementById('tool-pen').addEventListener('click', () => { setTool('pen'); showUI(); });
document.getElementById('tool-marker').addEventListener('click', () => { setTool('marker'); showUI(); });
document.getElementById('tool-eraser').addEventListener('click', () => { setTool('eraser'); showUI(); });
document.getElementById('tool-laser').addEventListener('click', () => { setTool('laser'); showUI(); });

document.getElementById('btn-prev').addEventListener('click', () => { if (current > 0) { current--; renderAll(); } showUI(); });
document.getElementById('btn-next').addEventListener('click', () => { if (current < slides.length - 1) { current++; renderAll(); } showUI(); });
document.getElementById('btn-add').addEventListener('click', () => { addSlide(); showUI(); });
document.getElementById('drawer-add').addEventListener('click', () => { addSlide(); showUI(); });
document.getElementById('btn-thumbs').addEventListener('click', () => { document.getElementById('thumb-drawer').classList.toggle('open'); showUI(false); });

document.getElementById('btn-undo').addEventListener('click', () => {
  const h = slides[current].hist;
  if (!h.length) { toast('Sin más acciones'); return; }
  const prev = h.pop(), oc = offCanvas(slides[current]), ctx = oc.getContext('2d');
  ctx.clearRect(0, 0, SW, SH); ctx.drawImage(prev, 0, 0);
  renderCurrent(); buildThumbs(); showUI();
});
document.getElementById('btn-clear').addEventListener('click', () => {
  saveHist();
  offCanvas(slides[current]).getContext('2d').clearRect(0, 0, SW, SH);
  renderCurrent(); buildThumbs(); showUI();
});

// Images
document.getElementById('btn-img').addEventListener('click', () => document.getElementById('file-img').click());
document.getElementById('file-img').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = ev => {
    const img = new Image();
    img.onload = () => {
      saveHist();
      const ctx = offCanvas(slides[current]).getContext('2d');
      const sc = Math.min(SW / img.width, SH / img.height) * .65;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(img, (SW - img.width * sc) / 2, (SH - img.height * sc) / 2, img.width * sc, img.height * sc);
      renderCurrent(); buildThumbs();
    };
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file); this.value = '';
});
document.getElementById('btn-bg').addEventListener('click', () => { document.getElementById('bg-panel').classList.toggle('open'); showUI(false); });
document.getElementById('file-bg').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = ev => {
    const img = new Image();
    img.onload = () => { slides[current].bgImg = img; slides[current].bg = null; renderAll(); };
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file); this.value = '';
});

/* ── Palette ───────────────────────────────────────── */
const pal = document.getElementById('palette');
COLORS.forEach(c => {
  const d = document.createElement('div'); d.className = 'cdot' + (c === color ? ' active' : '');
  d.style.background = c;
  d.addEventListener('click', () => { color = c; pal.querySelectorAll('.cdot').forEach(x => x.classList.remove('active')); d.classList.add('active'); showUI(); });
  pal.appendChild(d);
});

/* ── Size slider ───────────────────────────────────── */
document.getElementById('size-slider').addEventListener('input', function() {
  size = +this.value;
  const s = Math.max(3, Math.min(size, 18));
  document.getElementById('sz-dot').style.cssText = `width:${s}px;height:${s}px;border-radius:50%;background:var(--text);transition:width .1s,height .1s`;
  showUI();
});

/* ── Background swatches ───────────────────────────── */
const bgPanel = document.getElementById('bg-panel');
BG_COLORS.forEach(c => {
  const sw = document.createElement('div'); sw.className = 'bg-sw'; sw.style.background = c;
  sw.addEventListener('click', () => {
    slides[current].bgImg = null; slides[current].bg = c;
    bgPanel.querySelectorAll('.bg-sw').forEach(x => x.classList.remove('active')); sw.classList.add('active');
    renderAll();
  });
  bgPanel.appendChild(sw);
});
const fileSw = document.createElement('div'); fileSw.className = 'bg-sw';
fileSw.style.cssText = 'background:linear-gradient(135deg,#7ab8e8,#e8c87a);display:flex;align-items:center;justify-content:center;font-size:15px;';
fileSw.textContent = '🖼'; fileSw.title = 'Imagen de fondo';
fileSw.addEventListener('click', () => { document.getElementById('file-bg').click(); bgPanel.classList.remove('open'); });
bgPanel.appendChild(fileSw);

/* ── Keyboard ──────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { if (current < slides.length - 1) { current++; renderAll(); } }
  if (e.key === 'ArrowLeft') { if (current > 0) { current--; renderAll(); } }
  if (e.key === 'Escape') hideUI();
  showUI();
});

/* ── Toast ─────────────────────────────────────────── */
let toastTmr;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr); toastTmr = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── Init ──────────────────────────────────────────── */
['#1a1a2e','#16213e','#1e3a2f'].forEach(c => slides.push(mkSlide(c)));
resize();
setTimeout(() => { showUI(true); }, 400);
setTimeout(() => toast('Toca la pantalla para mostrar/ocultar controles'), 700);
</script>
</body>
</html>
