<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SlideCanvas">
<meta name="mobile-web-app-capable" content="yes">
<title>SlideCanvas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass:rgba(12,12,16,0.86);
  --gb:rgba(255,255,255,0.11);
  --accent:#e8c87a;
  --danger:#e87a7a;
  --text:#f0efe8;
  --dim:rgba(240,239,232,0.44);
}
html,body{
  width:100%;height:100%;
  overflow:hidden;background:#000;
  font-family:'DM Sans',system-ui,sans-serif;color:var(--text);
  touch-action:none;-webkit-user-select:none;user-select:none;
  margin:0;padding:0;
}

/* stage must cover every pixel */
#stage{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;
  overflow:hidden;background:#000;
}

/* ── Zoom wrapper — we transform this, NOT the canvases ── */
#zoomWrap{
  position:absolute;
  /* size set by JS to match slide aspect inside stage */
  transform-origin:center center;
  will-change:transform;
}
#sC,#dC{position:absolute;top:0;left:0;display:block}
#dC{cursor:crosshair;z-index:1;touch-action:none}

/* ── Floating UI ── */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
#ui.vis{opacity:1}
#ui>*{pointer-events:auto}

#topBar{
  position:absolute;top:max(20px, calc(env(safe-area-inset-top) + 8px));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:5px 9px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--gb);border-radius:40px;white-space:nowrap
}
#botBar{
  position:absolute;bottom:max(20px, calc(env(safe-area-inset-bottom) + 8px));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:3px;padding:6px 10px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--gb);border-radius:40px
}
#drawer{
  position:absolute;top:0;left:0;bottom:0;width:155px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--gb);
  display:flex;flex-direction:column;padding:72px 7px 16px;gap:7px;
  overflow-y:auto;overflow-x:hidden;
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)
}
#drawer.open{transform:translateX(0)}
#drawer::-webkit-scrollbar{width:2px}
#drawer::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:1px}

.thi{position:relative;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.thi.act{border-color:var(--accent)}
.thi canvas{display:block;width:100%;border-radius:3px}
.thn{position:absolute;bottom:2px;right:4px;font-size:9px;color:rgba(255,255,255,.4)}
.thd{position:absolute;top:2px;right:2px;width:15px;height:15px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s}
.thi:hover .thd{opacity:1}
#dAdd{display:flex;align-items:center;justify-content:center;height:30px;border-radius:7px;border:1.5px dashed rgba(255,255,255,.18);background:transparent;color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
#dAdd:hover{border-color:var(--accent);color:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:none;border-radius:9px;background:transparent;color:var(--dim);font-size:15px;cursor:pointer;transition:background .15s,color .15s,transform .1s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn.act{background:var(--accent);color:#1a1400}
.btn:active{transform:scale(.9)}
.btn.red{color:var(--danger)}
.btn.red:hover{background:rgba(232,122,122,.13)}

.sep{width:1px;height:22px;background:var(--gb);margin:0 2px;flex-shrink:0}
.cnt{font-size:11px;color:var(--dim);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

#pal{display:flex;gap:3px;align-items:center;padding:0 2px}
.cd{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .15s,border-color .15s}
.cd:hover{transform:scale(1.25)}
.cd.act{border-color:#fff;transform:scale(1.2)}

#szW{display:flex;align-items:center;gap:4px;padding:0 3px}
#szW input[type=range]{-webkit-appearance:none;width:56px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer}
#szW input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
#szPv{width:16px;height:16px;display:flex;align-items:center;justify-content:center}
#szDot{border-radius:50%;background:var(--text)}

#bgP{
  position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(6px);
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--gb);border-radius:14px;
  padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;max-width:260px;
  z-index:20;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s
}
#bgP.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.bgsw{width:28px;height:28px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0}
.bgsw:hover{transform:scale(1.15)}
.bgsw.act{border-color:#fff}

#loadOv{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loadOv.show{display:flex}
#loadBar{width:200px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
#loadFill{height:100%;background:var(--accent);border-radius:2px;transition:width .2s;width:0%}
#loadMsg{font-size:13px;color:var(--dim)}

/* Swipe transition animation */
#zoomWrap{transition:none}
#zoomWrap.slide-left{animation:slideLeft .25s ease forwards}
#zoomWrap.slide-right{animation:slideRight .25s ease forwards}
@keyframes slideLeft{from{transform:translateX(0) scale(var(--z,1))}to{transform:translateX(-100%) scale(var(--z,1))}}
@keyframes slideRight{from{transform:translateX(0) scale(var(--z,1))}to{transform:translateX(100%) scale(var(--z,1))}}

#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.2);pointer-events:none;z-index:5;transition:opacity .5s;white-space:nowrap}
#hint.gone{opacity:0}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:rgba(10,10,14,.92);border:1px solid var(--gb);color:var(--text);padding:6px 16px;border-radius:18px;font-size:12px;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}

/* Zoom level indicator */
#zoomBadge{
  position:fixed;top:72px;right:20px;
  background:var(--glass);border:1px solid var(--gb);border-radius:12px;
  padding:4px 10px;font-size:11px;color:var(--dim);
  z-index:11;opacity:0;transition:opacity .3s;pointer-events:none
}
#zoomBadge.show{opacity:1}
</style>
</head>
<body>

<div id="stage">
  <div id="zoomWrap">
    <canvas id="sC"></canvas>
    <canvas id="dC"></canvas>
  </div>
</div>

<div id="ui">
  <div id="topBar">
    <button class="btn" id="bTh">⊞</button>
    <div class="sep"></div>
    <button class="btn" id="bPrev">‹</button>
    <span class="cnt" id="cnt">1 / 1</span>
    <button class="btn" id="bNext">›</button>
    <div class="sep"></div>
    <button class="btn" id="bAdd" style="font-size:17px">＋</button>
    <div class="sep"></div>
    <button class="btn" id="bPdf" title="Importar PDF">📄</button>
    <button class="btn" id="bPptx" title="Importar PowerPoint">📊</button>
    <div class="sep"></div>
    <button class="btn" id="bImg" title="Insertar imagen">🖼</button>
    <button class="btn" id="bBg" title="Fondo">🎨</button>
    <div class="sep"></div>
    <button class="btn" id="bFs">⛶</button>
    <input type="file" id="fPdf" accept=".pdf" style="display:none">
    <input type="file" id="fPptx" accept=".pptx,.ppt" style="display:none">
    <input type="file" id="fImg" accept="image/*" style="display:none">
    <input type="file" id="fBg" accept="image/*" style="display:none">
  </div>
  <div id="botBar">
    <button class="btn act" id="tPen">✏️</button>
    <button class="btn" id="tMark">🖊</button>
    <button class="btn" id="tErase">⬜</button>
    <button class="btn" id="tLaser">🔴</button>
    <div class="sep"></div>
    <div id="pal"></div>
    <div class="sep"></div>
    <div id="szW">
      <div id="szPv"><div id="szDot" style="width:5px;height:5px"></div></div>
      <input type="range" id="szR" min="1" max="40" value="5">
    </div>
    <div class="sep"></div>
    <button class="btn" id="bUndo">↩</button>
    <button class="btn red" id="bClr">🗑</button>
  </div>
  <div id="drawer"><button id="dAdd">＋</button></div>
</div>

<div id="bgP"></div>
<div id="zoomBadge">100%</div>
<div id="loadOv">
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadMsg">Cargando...</div>
</div>
<div id="hint">Toca para controles · Lápiz dibuja · Desliza/pellizca con dedos</div>
<div id="toast"></div>

<script>
/* ─── PDF.js worker ──────────────────────────────── */
if(typeof pdfjsLib!=='undefined')
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ─── Constants ──────────────────────────────────── */
const SW=1920,SH=1080;
const COLORS=['#ffffff','#e8c87a','#7ab8e8','#e87a9a','#7ae8b8','#ff4444','#000000'];
const BGS=['#0f0f1a','#1a1a2e','#16213e','#1e3a2f','#2e1e1e','#2a1e2e','#111118','#f0ede4','#ffffff','#2d2d2d'];
const DEFBG=['#1a1a2e','#16213e','#1e3a2f','#2e1e1e','#2a1e2e'];

/* ─── State ──────────────────────────────────────── */
let slides=[],cur=0;
let tool='pen',color='#ffffff',sz=5;
let drawing=false,laserT=[],laserTmr=null;
let uiVis=false,uiTmr=null;

// Zoom state: purely CSS transform on #zoomWrap
let zoom=1, panX=0, panY=0;

/* ─── Elements ───────────────────────────────────── */
const stage=document.getElementById('stage');
const zoomWrap=document.getElementById('zoomWrap');
const sC=document.getElementById('sC'),dC=document.getElementById('dC');
const sX=sC.getContext('2d'),dX=dC.getContext('2d');

/* ─── Layout: fit current slide inside stage ─────────
   Each slide can have its own aspect ratio (e.g. 4:3
   for imported PDFs, 16:9 for default slides).
   SW×SH are the offscreen canvas dimensions and adapt
   to the current slide's AR.                          */
let stageW=0,stageH=0,slideDispW=0,slideDispH=0,slideOffX=0,slideOffY=0;

function slideAR(){
  // Use current slide's stored AR, default 16:9
  return slides[cur]?.ar || (SW/SH);
}

function layout(){
  stageW = window.innerWidth;
  stageH = window.innerHeight;

  stage.style.width = stageW + 'px';
  stage.style.height = stageH + 'px';

  const ar = slideAR();
  if(stageW / stageH > ar){
    slideDispH = stageH; slideDispW = stageH * ar;
  } else {
    slideDispW = stageW; slideDispH = stageW / ar;
  }
  slideOffX = (stageW - slideDispW) / 2;
  slideOffY = (stageH - slideDispH) / 2;

  const w = cW(), h = cH();
  sC.width = dC.width = w;
  sC.height = dC.height = h;
  sC.style.width = dC.style.width = slideDispW + 'px';
  sC.style.height = dC.style.height = slideDispH + 'px';

  zoomWrap.style.width = slideDispW + 'px';
  zoomWrap.style.height = slideDispH + 'px';
  zoomWrap.style.left = slideOffX + 'px';
  zoomWrap.style.top = slideOffY + 'px';

  applyZoomTransform();
  renderCur();
}
window.addEventListener('resize',layout);
document.addEventListener('fullscreenchange',layout);
document.addEventListener('webkitfullscreenchange',layout);

/* ─── Zoom transform ─────────────────────────────── */
function applyZoomTransform(){
  // Clamp pan so slide edges don't go off screen too far
  const maxPanX=(slideDispW*(zoom-1))/2;
  const maxPanY=(slideDispH*(zoom-1))/2;
  panX=Math.max(-maxPanX,Math.min(maxPanX,panX));
  panY=Math.max(-maxPanY,Math.min(maxPanY,panY));
  zoomWrap.style.transform=`scale(${zoom}) translate(${panX/zoom}px,${panY/zoom}px)`;

  const badge=document.getElementById('zoomBadge');
  badge.textContent=Math.round(zoom*100)+'%';
  clearTimeout(badge._t);
  if(zoom!==1){badge.classList.add('show');badge._t=setTimeout(()=>badge.classList.remove('show'),1500)}
  else badge.classList.remove('show');
}

/* ─── Coordinate mapping: screen → slide pixels ─────
   zoomWrap uses transform-origin:center center, so
   scale(zoom) expands from the wrapper's center.
   Then translate(panX/zoom, panY/zoom) shifts it.

   Inverse:
   1. screen pos relative to wrapper top-left
   2. shift origin to wrapper center
   3. undo zoom (divide by zoom)
   4. undo pan (subtract panX/zoom, panY/zoom)
   5. shift origin back to top-left
   6. scale display px → canvas px                    */
function screenToCanvas(sx,sy){
  const cx=slideOffX+slideDispW/2;
  const cy=slideOffY+slideDispH/2;
  const lx=(sx-cx)/zoom - panX/zoom + slideDispW/2;
  const ly=(sy-cy)/zoom - panY/zoom + slideDispH/2;
  return {x:lx*cW()/slideDispW, y:ly*cH()/slideDispH};
}

/* ─── Slide model ────────────────────────────────── */
function mkSlide(bg){return{bg:bg||DEFBG[slides.length%DEFBG.length],bgImg:null,off:null,hist:[],ar:SW/SH}}

function slideW(s){return s.ar>=1 ? SW : Math.round(SH*s.ar)}
function slideH(s){return s.ar>=1 ? Math.round(SW/s.ar) : SH}

function offC(s){
  if(!s.off){
    const c=document.createElement('canvas');
    c.width=slideW(s);c.height=slideH(s);
    s.off=c;
  }
  return s.off;
}

function addSlide(bg){slides.push(mkSlide(bg));cur=slides.length-1;layout();renderAll()}
function delSlide(i){
  if(slides.length<=1){toast('Mínimo una diapositiva');return}
  slides.splice(i,1);if(cur>=slides.length)cur=slides.length-1;layout();renderAll()
}

/* ─── Render ─────────────────────────────────────── */
function paintBg(ctx,s,w,h){
  if(s.bgImg){
    // contain — never crop, fill any remaining area with black
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    const sc=Math.min(w/s.bgImg.naturalWidth,h/s.bgImg.naturalHeight);
    const dw=s.bgImg.naturalWidth*sc,dh=s.bgImg.naturalHeight*sc;
    ctx.drawImage(s.bgImg,(w-dw)/2,(h-dh)/2,dw,dh);
  } else {ctx.fillStyle=s.bg;ctx.fillRect(0,0,w,h)}
}

function cW(){return slideW(slides[cur])}
function cH(){return slideH(slides[cur])}

function renderCur(){
  const s=slides[cur];
  const w=cW(),h=cH();
  sX.clearRect(0,0,w,h);paintBg(sX,s,w,h);
  dX.clearRect(0,0,w,h);if(s.off)dX.drawImage(s.off,0,0);
  document.getElementById('cnt').textContent=`${cur+1} / ${slides.length}`;
}
function renderAll(){renderCur();buildThumbs()}

function switchSlide(n){
  cur=n;
  layout(); // recalc AR for new slide
  renderAll();
}

/* ─── Thumbnails ─────────────────────────────────── */
function buildThumbs(){
  const dr=document.getElementById('drawer');
  dr.querySelectorAll('.thi').forEach(e=>e.remove());
  const ab=document.getElementById('dAdd');
  const TW=141,TH=Math.round(TW*(1/s.ar)||Math.round(TW*SH/SW));
  slides.forEach((s,i)=>{
    const sAR=s.ar||SW/SH;
    const tH=Math.round(TW/sAR);
    const div=document.createElement('div');div.className='thi'+(i===cur?' act':'');
    const c=document.createElement('canvas');c.width=TW;c.height=tH;
    const ctx=c.getContext('2d');paintBg(ctx,s,TW,tH);if(s.off)ctx.drawImage(s.off,0,0,TW,tH);
    div.appendChild(c);
    const num=document.createElement('span');num.className='thn';num.textContent=i+1;div.appendChild(num);
    const del=document.createElement('button');del.className='thd';del.textContent='×';
    del.addEventListener('click',e=>{e.stopPropagation();delSlide(i)});div.appendChild(del);
    div.addEventListener('click',()=>switchSlide(i));
    dr.insertBefore(div,ab);
  });
}

/* ─── Drawing engine ─────────────────────────────────
   Features:
   - Pressure sensitivity (Apple Pencil)
   - Velocity-based width (fast = thin, slow = thick)
   - Bezier curve smoothing (Catmull-Rom → Bezier)
   - Taper at stroke start and end
   - Tilt for marker/calligraphy effect
   - All strokes rendered as filled polygons for quality  */

function saveHist(){
  const s=slides[cur];const oc=offC(s);
  const snap=document.createElement('canvas');
  snap.width=slideW(s);snap.height=slideH(s);
  snap.getContext('2d').drawImage(oc,0,0);
  s.hist.push(snap);if(s.hist.length>30)s.hist.shift();
}

// Base line width in canvas pixels
function baseLW(){return sz*(cW()/slideDispW)/zoom}

// Parse color to rgba components
function parseColor(c){
  const hx=c.replace('#','');
  return[parseInt(hx.slice(0,2),16),parseInt(hx.slice(2,4),16),parseInt(hx.slice(4,6),16)];
}

/* Stroke point: canvas coords + width at that point */
let strokePts=[];   // [{x,y,w}]
let lastEvTime=0;
let lastEvX=0,lastEvY=0;

function ptWidth(pressure,vx,vy){
  const base=baseLW();
  if(tool==='eraser') return base*3;
  if(tool==='marker') return base*2.5;
  // pressure: 0.0–1.0 (default 0.5 when not available)
  const p=pressure>0?pressure:0.5;
  // velocity magnitude in canvas px/ms
  const vel=Math.hypot(vx,vy);
  // faster = thinner (velocity factor 0.4–1.0)
  const vFactor=Math.max(0.4,Math.min(1.0,1.0-vel*0.012));
  return base*(0.4+p*1.2)*vFactor;
}

/* Draw a smooth filled stroke through strokePts using
   perpendicular offsets → polygon outline            */
function flushStroke(ctx,finalise){
  const pts=strokePts;
  if(pts.length<2)return;
  const [r,g,b]=parseColor(color);
  const alpha=tool==='marker'?0.45:1.0;

  if(tool==='eraser'){
    ctx.globalCompositeOperation='destination-out';
    ctx.strokeStyle='rgba(0,0,0,1)';
    ctx.lineWidth=pts[pts.length-1].w;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
    ctx.globalCompositeOperation='source-over';
    return;
  }

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;

  // Build left and right edge arrays
  const left=[], right=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    // Tangent direction
    let tx,ty;
    if(i===0){ tx=pts[1].x-pts[0].x; ty=pts[1].y-pts[0].y; }
    else if(i===pts.length-1){ tx=pts[i].x-pts[i-1].x; ty=pts[i].y-pts[i-1].y; }
    else { tx=pts[i+1].x-pts[i-1].x; ty=pts[i+1].y-pts[i-1].y; }
    const len=Math.hypot(tx,ty)||1;
    const nx=-ty/len, ny=tx/len; // normal
    // Taper: ease in first 6 pts, ease out last 6 pts
    let taper=1;
    const taperLen=Math.min(6,Math.floor(pts.length*0.2));
    if(i<taperLen) taper=i/taperLen;
    else if(i>pts.length-1-taperLen) taper=(pts.length-1-i)/taperLen;
    taper=finalise?taper:Math.max(taper,i<taperLen?0.3:1); // don't taper end mid-stroke
    const hw=p.w*0.5*Math.max(0.05,taper);
    left.push({x:p.x+nx*hw,y:p.y+ny*hw});
    right.push({x:p.x-nx*hw,y:p.y-ny*hw});
  }

  // Smooth through left+right with quadratic bezier
  ctx.beginPath();
  // Left side forward
  ctx.moveTo(left[0].x,left[0].y);
  for(let i=1;i<left.length-1;i++){
    const mx=(left[i].x+left[i+1].x)/2, my=(left[i].y+left[i+1].y)/2;
    ctx.quadraticCurveTo(left[i].x,left[i].y,mx,my);
  }
  ctx.lineTo(left[left.length-1].x,left[left.length-1].y);
  // Round end cap
  const ep=pts[pts.length-1];
  ctx.arc(ep.x,ep.y,pts[pts.length-1].w*0.5*0.05,
    Math.atan2(right[right.length-1].y-ep.y,right[right.length-1].x-ep.x),
    Math.atan2(left[left.length-1].y-ep.y,left[left.length-1].x-ep.x));
  // Right side backward
  for(let i=right.length-2;i>0;i--){
    const mx=(right[i].x+right[i-1].x)/2,my=(right[i].y+right[i-1].y)/2;
    ctx.quadraticCurveTo(right[i].x,right[i].y,mx,my);
  }
  ctx.lineTo(right[0].x,right[0].y);
  // Start cap
  const sp=pts[0];
  ctx.arc(sp.x,sp.y,pts[0].w*0.5*0.05,
    Math.atan2(left[0].y-sp.y,left[0].x-sp.x),
    Math.atan2(right[0].y-sp.y,right[0].x-sp.x));
  ctx.closePath();
  ctx.fill();
}

/* Redraw the display canvas = offscreen + live stroke */
function redrawLive(){
  const s=slides[cur];const w=cW(),h=cH();
  sX.clearRect(0,0,w,h);paintBg(sX,s,w,h);
  dX.clearRect(0,0,w,h);if(s.off)dX.drawImage(s.off,0,0);
  if(strokePts.length>1)flushStroke(dX,false);
}

function penDown(sx,sy,pressure=0.5){
  if(tool==='laser'){laserT=[];drawing=true;return}
  saveHist();drawing=true;
  const p=screenToCanvas(sx,sy);
  lastEvTime=Date.now();lastEvX=p.x;lastEvY=p.y;
  strokePts=[{x:p.x,y:p.y,w:ptWidth(pressure,0,0)*0.3}]; // thin start
}

function penMove(sx,sy,pressure=0.5){
  if(!drawing)return;
  if(tool==='laser'){
    const p=screenToCanvas(sx,sy);
    laserT.push({...p,t:Date.now()});renderLaser();return;
  }
  const p=screenToCanvas(sx,sy);
  const now=Date.now();
  const dt=Math.max(1,now-lastEvTime);
  const vx=(p.x-lastEvX)/dt, vy=(p.y-lastEvY)/dt;
  const w=ptWidth(pressure,vx,vy);
  // Smooth width
  const prevW=strokePts.length>0?strokePts[strokePts.length-1].w:w;
  const smoothW=prevW*0.6+w*0.4;
  strokePts.push({x:p.x,y:p.y,w:smoothW});
  lastEvTime=now;lastEvX=p.x;lastEvY=p.y;
  redrawLive();
}

function penUp(){
  if(!drawing)return;drawing=false;
  if(tool==='laser'){
    if(laserTmr)clearTimeout(laserTmr);
    laserTmr=setTimeout(()=>{laserT=[];renderCur()},900);
    strokePts=[];return;
  }
  if(strokePts.length>0){
    const ox=offC(slides[cur]).getContext('2d');
    flushStroke(ox,true);
  }
  strokePts=[];
  renderCur();
  buildThumbs();
}

function renderLaser(){
  renderCur();const now=Date.now();
  laserT=laserT.filter(p=>now-p.t<800);if(laserT.length<2)return;
  const r=sz*(cW()/slideDispW)*.5;
  for(let i=1;i<laserT.length;i++){
    const a=(i/laserT.length)*.85;
    dX.beginPath();dX.arc(laserT[i].x,laserT[i].y,r,0,Math.PI*2);
    dX.fillStyle=`rgba(255,55,55,${a})`;dX.fill();
  }
  const h=laserT[laserT.length-1];
  dX.beginPath();dX.arc(h.x,h.y,r+2,0,Math.PI*2);
  dX.fillStyle='rgba(255,80,80,.95)';dX.fill();
}

/* ─── Unified pointer event handler ─────────────────
   pointerType='pen'|'mouse' → draw
   pointerType='touch'       → gesture (swipe/pinch)

   We track all active pointers by id so we can detect
   2-finger pinch without touch events.                */

const ptrs=new Map();
let ts=null;
let lastFingerTap={t:0,x:0,y:0};

function activeTouches(){return[...ptrs.values()].filter(p=>p.type==='touch')}

dC.addEventListener('pointerdown',e=>{
  if(hitUI(e))return;
  e.preventDefault();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

  if(e.pointerType==='pen'||e.pointerType==='mouse'){
    dC.setPointerCapture(e.pointerId);
    penDown(e.clientX,e.clientY,e.pressure||0.5);
    return;
  }

  // Touch finger
  const fingers=activeTouches();
  if(fingers.length===1){
    ts={type:'swipe',x0:e.clientX,y0:e.clientY,
        moved:false,t:Date.now(),px0:panX,py0:panY};
  } else if(fingers.length===2){
    const [a,b]=fingers;
    ts={type:'pinch',d0:Math.hypot(b.x-a.x,b.y-a.y),
        z0:zoom,px0:panX,py0:panY,
        mx0:(a.x+b.x)/2,my0:(a.y+b.y)/2};
  }
},{passive:false});

dC.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  e.preventDefault();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

  if(e.pointerType==='pen'||e.pointerType==='mouse'){
    if(!drawing)return;
    const evts=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evts)penMove(ev.clientX,ev.clientY,ev.pressure||0.5);
    return;
  }

  // Touch finger gestures
  if(!ts)return;
  const fingers=activeTouches();

  if(ts.type==='swipe'&&fingers.length===1){
    const dx=e.clientX-ts.x0, dy=e.clientY-ts.y0;
    if(Math.abs(dx)>6||Math.abs(dy)>6)ts.moved=true;
    if(zoom>1){
      panX=ts.px0+dx; panY=ts.py0+dy;
      applyZoomTransform();
    } else if(Math.abs(dx)>Math.abs(dy)){
      zoomWrap.style.transform=`translateX(${dx*0.35}px)`;
    }
  } else if(ts.type==='pinch'&&fingers.length===2){
    const [a,b]=fingers;
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    zoom=Math.max(1,Math.min(5,ts.z0*(d/ts.d0)));
    panX=ts.px0+(mx-ts.mx0);
    panY=ts.py0+(my-ts.my0);
    applyZoomTransform();
  }
},{passive:false});

dC.addEventListener('pointerup',e=>{
  if(!ptrs.has(e.pointerId))return;
  e.preventDefault();

  if(e.pointerType==='pen'||e.pointerType==='mouse'){
    ptrs.delete(e.pointerId);
    penUp();
    return;
  }

  // Finger lifted
  const x0=ts?.x0??e.clientX, y0=ts?.y0??e.clientY;
  const dx=e.clientX-x0, dy=e.clientY-y0;
  const dt=Date.now()-(ts?.t??0);
  ptrs.delete(e.pointerId);
  const fingers=activeTouches();

  if(ts?.type==='swipe'){
    zoomWrap.style.transform=`scale(${zoom}) translate(${panX/zoom}px,${panY/zoom}px)`;
    if(zoom<=1&&ts.moved&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40&&dt<500){
      // Swipe → change slide
      if(dx<0&&cur<slides.length-1){switchSlide(cur+1)}
      else if(dx>0&&cur>0){switchSlide(cur-1)}
    } else if(!ts.moved&&dt<280){
      // Single tap → show menu (if hidden)
      // Double tap → hide menu (if visible)
      const now=Date.now();
      const distFromLast=Math.hypot(e.clientX-lastFingerTap.x, e.clientY-lastFingerTap.y);
      const isDoubleTap=now-lastFingerTap.t<400&&distFromLast<40;
      if(isDoubleTap){
        hideUI();
        lastFingerTap={t:0,x:0,y:0};
      } else {
        if(!uiVis) showUI();
        lastFingerTap={t:now,x:e.clientX,y:e.clientY};
      }
    }
    ts=null;
  } else if(ts?.type==='pinch'){
    if(zoom<=1.05){zoom=1;panX=0;panY=0;applyZoomTransform()}
    // One finger remains → switch to pan/swipe
    if(fingers.length===1){
      const rem=fingers[0];
      ts={type:'swipe',x0:rem.x,y0:rem.y,moved:false,t:Date.now(),px0:panX,py0:panY};
    } else {
      ts=null;
    }
  }
},{passive:false});

dC.addEventListener('pointercancel',e=>{
  if(e.pointerType==='pen'||e.pointerType==='mouse') penUp();
  ptrs.delete(e.pointerId);
  if(activeTouches().length===0)ts=null;
  zoomWrap.style.transform=`scale(${zoom}) translate(${panX/zoom}px,${panY/zoom}px)`;
});

/* ─── hitUI helper ───────────────────────────────── */
function hitUI(e){
  const s=e.touches?e.touches[0]:e;
  const el=document.elementFromPoint(s.clientX,s.clientY);
  return el&&el.closest('#ui,#bgP,#loadOv');
}

/* ─── PDF Import ─────────────────────────────────── */
document.getElementById('bPdf').addEventListener('click',()=>document.getElementById('fPdf').click());
document.getElementById('fPdf').addEventListener('change',async function(){
  const file=this.files[0];if(!file)return;this.value='';
  if(typeof pdfjsLib==='undefined'){toast('PDF.js no cargó');return}
  showLoad('Leyendo PDF…',5);
  try{
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    const total=pdf.numPages,insertAt=slides.length;
    for(let i=1;i<=total;i++){
      showLoad(`Convirtiendo página ${i} de ${total}…`,Math.round(i/total*90));
      const page=await pdf.getPage(i);
      const vp=page.getViewport({scale:1});
      const pageAR=vp.width/vp.height;
      const scale=Math.min(SW/vp.width,SH/vp.height);
      const viewport=page.getViewport({scale});
      const tmp=document.createElement('canvas');
      tmp.width=viewport.width;tmp.height=viewport.height;
      await page.render({canvasContext:tmp.getContext('2d'),viewport}).promise;
      const img=new Image();img.src=tmp.toDataURL();
      await new Promise(res=>{img.onload=res});
      const s=mkSlide('#111118');s.bgImg=img;s.ar=pageAR;
      slides.splice(insertAt+i-1,0,s);
    }
    cur=insertAt;hideLoad();layout();renderAll();
    toast(`✓ PDF: ${total} página${total>1?'s':''}`);showUI();
  }catch(e){hideLoad();toast('Error al leer el PDF');console.error(e)}
});

/* ─── PPTX Import ────────────────────────────────── */
document.getElementById('bPptx').addEventListener('click',()=>document.getElementById('fPptx').click());
document.getElementById('fPptx').addEventListener('change',async function(){
  const file=this.files[0];if(!file)return;this.value='';
  if(typeof JSZip==='undefined'){toast('JSZip no cargó');return}
  showLoad('Leyendo PowerPoint…',5);
  try{
    const ab=await file.arrayBuffer();
    const zip=await JSZip.loadAsync(ab);

    // Detect presentation AR from ppt/presentation.xml
    let pptxAR=4/3; // default 4:3
    if(zip.files['ppt/presentation.xml']){
      const presXml=await zip.files['ppt/presentation.xml'].async('string');
      const presDoc=new DOMParser().parseFromString(presXml,'text/xml');
      const sldSz=presDoc.getElementsByTagNameNS('*','sldSz')[0];
      if(sldSz){
        const cx=parseInt(sldSz.getAttribute('cx')||'9144000');
        const cy=parseInt(sldSz.getAttribute('cy')||'6858000');
        pptxAR=cx/cy;
      }
    }

    const slideEntries=Object.keys(zip.files)
      .filter(k=>k.match(/^ppt\/slides\/slide\d+\.xml$/))
      .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
    if(!slideEntries.length){hideLoad();toast('No se encontraron diapositivas');return}
    const total=slideEntries.length,insertAt=slides.length;
    const parser=new DOMParser();
    for(let i=0;i<total;i++){
      showLoad(`Procesando diapositiva ${i+1} de ${total}…`,Math.round(5+(i/total)*85));
      const xmlStr=await zip.files[slideEntries[i]].async('string');
      const xmlDoc=parser.parseFromString(xmlStr,'text/xml');
      const relPath=slideEntries[i].replace('slides/slide','slides/_rels/slide').replace('.xml','.xml.rels');
      let rels={};
      if(zip.files[relPath]){
        const relDoc=parser.parseFromString(await zip.files[relPath].async('string'),'text/xml');
        relDoc.querySelectorAll('Relationship').forEach(r=>{rels[r.getAttribute('Id')]=r.getAttribute('Target')});
      }
      const tW=pptxAR>=1?SW:Math.round(SH*pptxAR);
      const tH=pptxAR>=1?Math.round(SW/pptxAR):SH;
      const tmp=document.createElement('canvas');tmp.width=tW;tmp.height=tH;
      const ctx=tmp.getContext('2d');
      let bgColor='#1a1a2e';
      const bgEls=xmlDoc.getElementsByTagNameNS('*','bg');
      if(bgEls.length){
        const sf=bgEls[0].getElementsByTagNameNS('*','solidFill')[0];
        if(sf){const sc=sf.getElementsByTagNameNS('*','srgbClr')[0];if(sc)bgColor='#'+sc.getAttribute('val')}
      }
      ctx.fillStyle=bgColor;ctx.fillRect(0,0,tW,tH);
      for(const bf of xmlDoc.getElementsByTagNameNS('*','blipFill')){
        const blip=bf.getElementsByTagNameNS('*','blip')[0];if(!blip)continue;
        const rEmbed=blip.getAttribute('r:embed')||blip.getAttribute('embed');
        if(!rEmbed||!rels[rEmbed])continue;
        const mediaKey=Object.keys(zip.files).find(k=>k==='ppt/media/'+rels[rEmbed].split('/').pop());
        if(!mediaKey)continue;
        try{
          const md=await zip.files[mediaKey].async('base64');
          const ext=mediaKey.split('.').pop().toLowerCase();
          const mime=ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='png'?'image/png':'image/'+ext;
          const img=new Image();img.src=`data:${mime};base64,${md}`;
          await new Promise(res=>{img.onload=res;img.onerror=res});
          if(img.width>0){const sc=Math.min(tW/img.width,tH/img.height);ctx.drawImage(img,(tW-img.width*sc)/2,(tH-img.height*sc)/2,img.width*sc,img.height*sc)}
        }catch(e){}
      }
      let yOff=80;const drawn=new Set();
      for(const txb of xmlDoc.getElementsByTagNameNS('*','txBody')){
        for(const p of txb.getElementsByTagNameNS('*','p')){
          let text='';
          for(const r of p.getElementsByTagNameNS('*','r')){const t=r.getElementsByTagNameNS('*','t')[0];if(t)text+=t.textContent}
          text=text.trim();if(!text||drawn.has(text))continue;drawn.add(text);
          let fs=28;
          const rPr=txb.getElementsByTagNameNS('*','rPr')[0];
          if(rPr){const s=rPr.getAttribute('sz');if(s)fs=Math.round(parseInt(s)/100*(tH/720))}
          fs=Math.max(16,Math.min(fs,72));
          let tc='#ffffff';
          if(rPr){const sf=rPr.getElementsByTagNameNS('*','solidFill')[0];if(sf){const sc=sf.getElementsByTagNameNS('*','srgbClr')[0];if(sc)tc='#'+sc.getAttribute('val')}}
          ctx.font=`${fs}px system-ui,sans-serif`;ctx.fillStyle=tc;ctx.textAlign='center';
          ctx.fillText(text,tW/2,yOff+fs,tW-120);yOff+=fs+12;if(yOff>tH-60)break;
        }
        if(yOff>tH-60)break;
      }
      const img=new Image();img.src=tmp.toDataURL('image/jpeg',0.92);
      await new Promise(res=>{img.onload=res});
      const s=mkSlide('#111118');s.bgImg=img;s.ar=pptxAR;slides.splice(insertAt+i,0,s);
    }
    cur=insertAt;hideLoad();layout();renderAll();
    toast(`✓ PPTX: ${total} diapositiva${total>1?'s':''}`);showUI();
  }catch(e){hideLoad();toast('Error al leer el PPTX');console.error(e)}
});

/* ─── Fullscreen ─────────────────────────────────── */
const bFs=document.getElementById('bFs');
let userExitedFS=false; // true only when user explicitly pressed exit

function enterFS(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req) req.call(el,{navigationUI:'hide'}).catch(()=>{});
}

function toggleFS(){
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(isFs){
    userExitedFS=true;
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  } else {
    userExitedFS=false;
    enterFS();
  }
  showUI();
}
bFs.addEventListener('click',toggleFS);

function onFSChange(){
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  bFs.textContent=isFs?'⊠':'⛶';
  layout();
  // If fullscreen was lost without user asking → re-enter after short delay
  if(!isFs && !userExitedFS){
    setTimeout(()=>{
      // Only re-enter if still not in fullscreen and user hasn't explicitly exited
      if(!document.fullscreenElement && !document.webkitFullscreenElement && !userExitedFS){
        enterFS();
      }
    }, 300);
  }
  if(isFs) userExitedFS=false; // reset flag when successfully in fullscreen
}
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);

  if(e.key==='Escape')hideUI();
  showUI();
});

/* ─── Toast ──────────────────────────────────────── */
let toastTmr;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTmr);toastTmr=setTimeout(()=>el.classList.remove('show'),2500);
}

/* ─── Init ───────────────────────────────────────── */
DEFBG.slice(0,3).forEach(c=>slides.push(mkSlide(c)));
// Delay layout so iOS PWA has time to settle final viewport dimensions
setTimeout(()=>{
  layout();
  setTimeout(()=>showUI(true), 200);
  setTimeout(()=>toast(`${stageW}×${stageH}`), 500);
}, 100);
</script>
